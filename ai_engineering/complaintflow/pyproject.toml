[project]
name = "complaintflow"
version = "0.1.0"
description = "Bounded AI complaint triage with retrieval, fallbacks, and evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
