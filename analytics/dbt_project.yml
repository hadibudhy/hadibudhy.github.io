name: ae_product_analytics
version: '1.0.0'
config-version: 2
profile: ae_product_analytics
model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
analysis-paths: [analyses]
target-path: target
clean-targets: [target, dbt_packages]
models:
  ae_product_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
seeds:
  ae_product_analytics:
    +schema: raw
    +quote_columns: false
    ci:
      events:
        +alias: events
      sec_company_facts:
        +alias: company_facts
        +column_types:
          fy: integer
          value: double
      expected_financial_metrics:
        +alias: expected_financial_metrics
        +column_types:
          fiscal_year: integer
          revenue: bigint
          net_income: bigint
          source_accession: varchar
          source_document_url: varchar
          source_document_sha256: varchar
          source_table: varchar
      nyc311_requests:
        +alias: requests
