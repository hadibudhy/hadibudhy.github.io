<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Reorder history is observable; incremental value is not</title>
  <desc id="desc">The visual keeps the growth hypothesis separate from the economics the public release cannot measure. Source: Instacart public release.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Reorder history is observable; incremental value is not</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The visual keeps the growth hypothesis separate from the economics the public release cannot</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">measure.</text>
  <rect x="82" y="220" width="480" height="310" fill="#ecfdf5" stroke="#10b981"/><rect x="638" y="220" width="480" height="310" fill="#fff7ed" stroke="#d97706"/><text x="112" y="270" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Observed in the public source</text><text x="668" y="270" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Not observed / do not claim</text><text x="120" y="320" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">order_number and</text><text x="155" y="343" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">days_since_prior_order</text><text x="120" y="368" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">product-level reordered flag</text><text x="120" y="416" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">aisle and department context</text><text x="676" y="320" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">reminder assignment or holdout</text><text x="676" y="368" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">inventory and substitutions</text><text x="676" y="416" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">margin and incremental orders</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Instacart public release</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Observed vs not observed</text>
</svg>