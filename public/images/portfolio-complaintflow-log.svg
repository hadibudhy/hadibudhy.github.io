<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ComplaintFlow turns every AI decision into an auditable workflow record</title>
  <desc id="desc">The reference design keeps input validation, redaction, retrieval, escalation, and logging distinct. Source: ComplaintFlow reference implementation.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">ComplaintFlow turns every AI decision into an auditable workflow record</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The reference design keeps input validation, redaction, retrieval, escalation, and logging</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">distinct.</text>
  <text x="82" y="208" fill="#155eef" font-family="Arial, sans-serif" font-size="15px" font-weight="700" text-anchor="start">CONCEPTUAL DESIGN</text><rect x="82.0" y="300" width="235.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="106.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">01</text><text x="102.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Validate</text><text x="102.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Schema and PII</text><line x1="325.0" y1="385" x2="341.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 331.0 376 L 341.0 385 L 331.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="349.0" y="300" width="235.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="373.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">02</text><text x="369.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Retrieve</text><text x="369.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Approved playbook</text><line x1="592.0" y1="385" x2="608.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 598.0 376 L 608.0 385 L 598.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="616.0" y="300" width="235.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="640.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">03</text><text x="636.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Escalate</text><text x="636.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Uncertainty</text><line x1="859.0" y1="385" x2="875.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 865.0 376 L 875.0 385 L 865.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="883.0" y="300" width="235.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="907.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">04</text><text x="903.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Log</text><text x="903.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Evidence and outcome</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: ComplaintFlow reference implementation</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Conceptual design — not an observed outcome</text>
