  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The decision is a relevance-versus-coverage trade-off, not a single opaque score.</text>
  <text x="82" y="208" fill="#155eef" font-family="Arial, sans-serif" font-size="15px" font-weight="700" text-anchor="start">CONCEPTUAL DESIGN</text><rect x="82.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="106.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">01</text><text x="102.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Benchmark</text><text x="102.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Popularity baseline</text><line x1="414.0" y1="385" x2="430.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 420.0 376 L 430.0 385 L 420.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="438.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="462.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">02</text><text x="458.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Personalize</text><text x="458.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">History and tags</text><line x1="770.0" y1="385" x2="786.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 776.0 376 L 786.0 385 L 776.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="794.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="818.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">03</text><text x="814.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Test</text><text x="814.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Coverage and satisfaction</text><text x="814.0" y="457" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">guardrails</text>
