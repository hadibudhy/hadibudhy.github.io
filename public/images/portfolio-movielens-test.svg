  <title id="title">Keep popularity as a benchmark while testing controlled exploration</title>
  <desc id="desc">The decision is a relevance-versus-coverage trade-off, not a single opaque score. Source: GroupLens MovieLens 25M.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
