<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The public Google Analytics release is historical, not current budget evidence</title>
  <desc id="desc">Feature and target windows must be kept separate before comparing acquisition quality. Source: Google Analytics Customer Revenue Prediction source documentation.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">The public Google Analytics release is historical, not current budget</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">evidence</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Feature and target windows must be kept separate before comparing acquisition quality.</text>
  <line x1="120" y1="370" x2="1080" y2="370" stroke="#d9dde3" stroke-width="5"/><circle cx="140.0" cy="370" r="14" fill="#155eef"/><text x="140.0" y="315" fill="#171717" font-family="Arial, sans-serif" font-size="20px" font-weight="700" text-anchor="middle">Aug 2016–Apr 2018</text><text x="140.0" y="270" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle">training visits</text><circle cx="600.0" cy="370" r="14" fill="#10b981"/><text x="600.0" y="447" fill="#171717" font-family="Arial, sans-serif" font-size="20px" font-weight="700" text-anchor="middle">May–Oct 2018</text><text x="600.0" y="495" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle">forward test visits</text><circle cx="1060.0" cy="370" r="14" fill="#d97706"/><text x="1060.0" y="315" fill="#171717" font-family="Arial, sans-serif" font-size="20px" font-weight="700" text-anchor="middle">Dec 2018–Jan 2019</text><text x="1060.0" y="270" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle">competition target</text><text x="1060.0" y="291" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="middle">period; not in file</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Google Analytics Customer Revenue Prediction source documentation</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Time boundary from source documentation</text>
</svg>