<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One anonymized feature band contains most of the exploratory lift</title>
  <desc id="desc">Intention-to-treat conversion difference across complete f0 quartiles; n=13,979,592 benchmark rows. Bands are not customer personas. Source: Criteo Uplift Modeling Dataset.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">One anonymized feature band contains most of the exploratory lift</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Intention-to-treat conversion difference across complete f0 quartiles; n=13,979,592 benchmark</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">rows. Bands are not customer personas.</text>
  <text x="82" y="215" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="700" text-anchor="start">Absolute conversion lift (percentage points)</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="170" y="480.4" width="160" height="24.6" fill="#155eef"/><text x="250.0" y="462.38860103626945" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">0.038</text><text x="250.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">f0 Q1</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="410" y="255.0" width="160" height="250.0" fill="#10b981"/><text x="490.0" y="237.0" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">0.386</text><text x="490.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">f0 Q2</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="650" y="492.7" width="160" height="12.3" fill="#155eef"/><text x="730.0" y="474.6943005181347" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">0.019</text><text x="730.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">f0 Q3</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="890" y="498.5" width="160" height="6.5" fill="#10b981"/><text x="970.0" y="480.52331606217615" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">0.01</text><text x="970.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">f0 Q4</text>
