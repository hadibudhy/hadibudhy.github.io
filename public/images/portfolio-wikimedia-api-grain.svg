<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Wikimedia pageviews provide an explicit product-demand grain</title>
  <desc id="desc">The API separates the dimensions needed to distinguish durable interest from a temporary spike. Source: Wikimedia Analytics API.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Wikimedia pageviews provide an explicit product-demand grain</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The API separates the dimensions needed to distinguish durable interest from a temporary spike.</text>
  <rect x="82" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="106" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Page</text><text x="106" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">article or project</text><text x="106" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Content unit</text><rect x="360" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="384" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Period</text><text x="384" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">daily or monthly</text><text x="384" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Trend window</text><rect x="638" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="662" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Access</text><text x="662" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">desktop, mobile,</text><text x="662" y="379" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">app</text><text x="662" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Experience context</text><rect x="916" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="940" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Agent</text><text x="940" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">human or automated</text><text x="940" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Traffic quality</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Wikimedia Analytics API</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Real source metadata</text>
</svg>