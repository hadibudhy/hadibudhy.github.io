d</text><text x="524.4" y="457" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">value</text><line x1="703.5999999999999" y1="385" x2="707.5999999999999" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 697.5999999999999 376 L 707.5999999999999 385 L 697.5999999999999 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="715.5999999999999" y="300" width="191.2" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="739.5999999999999" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">04</text><text x="735.5999999999999" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Contract</text><text x="735.5999999999999" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Signed terms</text><line x1="914.8" y1="385" x2="918.8" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 908.8 376 L 918.8 385 L 908.8 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="926.8" y="300" width="191.2" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="950.8" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">05</text><text x="946.8" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Implement</text><text x="946.8" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Progress and</text><text x="946.8" y="457" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">payments</text>
