<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PageValues separates sessions sharply—and is unsafe for pre-intervention targeting</title>
  <desc id="desc">Positive PageValues is a downstream diagnostic; it is not evidence that a prompt caused conversion. Source: UCI Online Shoppers Purchasing Intention, 2018.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">PageValues separates sessions sharply—and is unsafe for pre-intervention</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">targeting</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Positive PageValues is a downstream diagnostic; it is not evidence that a prompt caused</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">conversion.</text>
  <text x="82" y="215" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="700" text-anchor="start">Revenue=True rate (%)</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="170" y="255.0" width="160" height="250.0" fill="#155eef"/><text x="250.0" y="237.0" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">56.3</text><text x="250.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">PageValues &gt; 0 ·</text><text x="250.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">n=2,730</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="410" y="487.7" width="160" height="17.3" fill="#10b981"/><text x="490.0" y="469.68206039076375" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">3.9</text><text x="490.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">PageValues = 0 ·</text><text x="490.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">n=9,475</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: UCI Online Shoppers Purchasing Intention, 2018</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Leakage warning</text>
</svg>