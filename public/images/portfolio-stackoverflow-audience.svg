<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Professional developers are the majority, but not the whole survey audience</title>
  <desc id="desc">2025 Stack Overflow Developer Survey; the remainder includes learners and adjacent roles. Source: Stack Overflow Developer Survey 2025, n=49,019.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Professional developers are the majority, but not the whole survey</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">audience</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">2025 Stack Overflow Developer Survey; the remainder includes learners and adjacent roles.</text>
  <text x="82" y="215" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="700" text-anchor="start">Share of respondents (%)</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="170" y="255.0" width="160" height="250.0" fill="#155eef"/><text x="250.0" y="237.0" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">76</text><text x="250.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Professional</text><text x="250.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">developers</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="410" y="455.7" width="160" height="49.3" fill="#10b981"/><text x="490.0" y="437.6578947368421" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">15</text><text x="490.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Aspirational/adjacent</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="650" y="475.4" width="160" height="29.6" fill="#155eef"/><text x="730.0" y="457.39473684210526" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">9</text><text x="730.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Other</text><text x="730.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">respondents</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Stack Overflow Developer Survey 2025, n=49,019</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Unweighted descriptive context</text>
</svg>