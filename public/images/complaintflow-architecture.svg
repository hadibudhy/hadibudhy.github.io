<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ComplaintFlow production architecture</title>
  <desc id="desc">Complaint text flows through redaction, baseline classification, playbook retrieval, provider validation, escalation, and SQLite persistence.</desc>
  <rect width="1200" height="560" fill="#07111f"/>
  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <text x="60" y="56" font-size="28" font-weight="700">ComplaintFlow: bounded AI triage with a safe fallback</text>
    <g stroke="#334155" stroke-width="2" fill="#0b1728">
      <rect x="60" y="170" width="170" height="100" rx="16"/><rect x="280" y="170" width="170" height="100" rx="16"/>
      <rect x="500" y="100" width="190" height="100" rx="16"/><rect x="500" y="240" width="190" height="100" rx="16"/>
      <rect x="740" y="170" width="190" height="100" rx="16"/><rect x="980" y="170" width="160" height="100" rx="16"/>
      <rect x="500" y="410" width="190" height="80" rx="16" fill="#172554"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="145" y="210"><tspan x="145">Complaint</tspan><tspan x="145" dy="25">API</tspan></text>
      <text x="365" y="210"><tspan x="365">Redact</tspan><tspan x="365" dy="25">and normalize</tspan></text>
      <text x="595" y="140"><tspan x="595">Baseline</tspan><tspan x="595" dy="25">classifier</tspan></text>
      <text x="595" y="280"><tspan x="595">Approved</tspan><tspan x="595" dy="25">playbook retrieval</tspan></text>
      <text x="835" y="210"><tspan x="835">Provider +</tspan><tspan x="835" dy="25">schema checks</tspan></text>
      <text x="1060" y="210"><tspan x="1060">Decision</tspan><tspan x="1060" dy="25">or escalate</tspan></text>
      <text x="595" y="445"><tspan x="595">SQLite audit log</tspan><tspan x="595" dy="25">latency + citations</tspan></text>
    </g>
    <g stroke="#60a5fa" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M230 220h50M450 220h40M690 150h45M690 290h45M930 220h45"/>
      <path d="M835 270v140H690M1060 270v140H690"/>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/></marker></defs>
</svg>
