<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ComplaintFlow routes uncertain cases to a human before release</title>
  <desc id="desc">The conceptual workflow validates and redacts input, retrieves approved guidance, checks output, escalates uncertainty, and records each decision. Source: ComplaintFlow reference architecture.</desc>
  <rect width="1200" height="680" fill="#FAFAF8"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#225B73"/>
  <text x="82" y="72" fill="#202B30" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">ComplaintFlow routes uncertain cases to a human before release</text>
  <text x="82" y="150" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The conceptual workflow validates and redacts input, retrieves approved guidance, checks output,</text><text x="82" y="174" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">escalates uncertainty, and records each decision.</text>
  <text x="82" y="208" fill="#225B73" font-family="Arial, sans-serif" font-size="15px" font-weight="700" text-anchor="start">CONCEPTUAL DESIGN</text><rect x="82.0" y="300" width="191.2" height="170" fill="#F1F4F5" stroke="#C9D3D8"/><text x="106.0" y="348" fill="#225B73" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">01</text><text x="102.0" y="388" fill="#202B30" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Validate</text><text x="102.0" y="437" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Complaint API and</text><text x="102.0" y="457" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">PII</text><line x1="281.2" y1="385" x2="285.2" y2="385" stroke="#225B73" stroke-width="3"/><path d="M 275.2 376 L 285.2 385 L 275.2 394" fill="none" stroke="#225B73" stroke-width="3"/><rect x="293.2" y="300" width="191.2" height="170" fill="#F1F4F5" stroke="#C9D3D8"/><text x="317.2" y="348" fill="#225B73" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">02</text><text x="313.2" y="388" fill="#202B30" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Retrieve</text><text x="313.2" y="437" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Approved playbook</text><text x="313.2" y="457" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">or baseline</text><line x1="492.4" y1="385" x2="496.4" y2="385" stroke="#225B73" stroke-width="3"/><path d="M 486.4 376 L 496.4 385 L 486.4 394" fill="none" stroke="#225B73" stroke-width="3"/><rect x="504.4" y="300" width="191.2" height="170" fill="#F1F4F5" stroke="#C9D3D8"/><text x="528.4" y="348" fill="#225B73" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">03</text><text x="524.4" y="388" fill="#202B30" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Check</text><text x="524.4" y="437" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Provider response</text><text x="524.4" y="457" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">and evidence</text><line x1="703.5999999999999" y1="385" x2="707.5999999999999" y2="385" stroke="#225B73" stroke-width="3"/><path d="M 697.5999999999999 376 L 707.5999999999999 385 L 697.5999999999999 394" fill="none" stroke="#225B73" stroke-width="3"/><rect x="715.5999999999999" y="300" width="191.2" height="170" fill="#F1F4F5" stroke="#C9D3D8"/><text x="739.5999999999999" y="348" fill="#225B73" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">04</text><text x="735.5999999999999" y="388" fill="#202B30" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Decide</text><text x="735.5999999999999" y="437" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Answer or human</text><text x="735.5999999999999" y="457" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">escalation</text><line x1="914.8" y1="385" x2="918.8" y2="385" stroke="#225B73" stroke-width="3"/><path d="M 908.8 376 L 918.8 385 L 908.8 394" fill="none" stroke="#225B73" stroke-width="3"/><rect x="926.8" y="300" width="191.2" height="170" fill="#F1F4F5" stroke="#C9D3D8"/><text x="950.8" y="348" fill="#225B73" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">05</text><text x="946.8" y="388" fill="#202B30" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Log</text><text x="946.8" y="437" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Audit trail and</text><text x="946.8" y="457" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">outcome</text>
  <text x="82" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: ComplaintFlow reference architecture</text>
  <text x="1118" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Conceptual design - not an observed outcome</text>
</svg>