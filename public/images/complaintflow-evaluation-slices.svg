<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic evaluation cases by slice</title>
  <desc id="desc">All five hand-written slices routed correctly. Bar length shows the number of cases; each row labels correct cases over total cases. The fixture contains 20 synthetic examples and does not estimate real-world accuracy.</desc>
  <rect width="1200" height="680" fill="#FFFEFA"/>
  <rect x="48" y="42" width="8" height="94" rx="4" fill="#155B49"/>
  <text x="80" y="82" fill="#17251E" font-family="IBM Plex Sans, sans-serif" font-size="32" font-weight="600">Synthetic evaluation cases by slice</text>
  <text x="80" y="125" fill="#52635A" font-family="IBM Plex Sans, sans-serif" font-size="18">20 hand-written cases · correct routes or escalations by slice</text>
  <text x="80" y="266" fill="#17251E" font-size="21" font-weight="600">Standard</text><rect x="300" y="235" width="610" height="46" rx="8" fill="#EAF0EB"/><rect x="300" y="235" width="305" height="46" rx="8" fill="#155B49"/><text x="940" y="265" fill="#17251E" font-size="20" font-weight="500">4 / 4 correct</text><text x="80" y="344" fill="#17251E" font-size="21" font-weight="600">Unknown</text><rect x="300" y="313" width="610" height="46" rx="8" fill="#EAF0EB"/><rect x="300" y="313" width="229" height="46" rx="8" fill="#155B49"/><text x="940" y="343" fill="#17251E" font-size="20" font-weight="500">3 / 3 correct</text><text x="80" y="422" fill="#17251E" font-size="21" font-weight="600">Pii</text><rect x="300" y="391" width="610" height="46" rx="8" fill="#EAF0EB"/><rect x="300" y="391" width="152" height="46" rx="8" fill="#155B49"/><text x="940" y="421" fill="#17251E" font-size="20" font-weight="500">2 / 2 correct</text><text x="80" y="500" fill="#17251E" font-size="21" font-weight="600">Paraphrase</text><rect x="300" y="469" width="610" height="46" rx="8" fill="#EAF0EB"/><rect x="300" y="469" width="610" height="46" rx="8" fill="#155B49"/><text x="940" y="499" fill="#17251E" font-size="20" font-weight="500">8 / 8 correct</text><text x="80" y="578" fill="#17251E" font-size="21" font-weight="600">Short</text><rect x="300" y="547" width="610" height="46" rx="8" fill="#EAF0EB"/><rect x="300" y="547" width="229" height="46" rx="8" fill="#155B49"/><text x="940" y="577" fill="#17251E" font-size="20" font-weight="500">3 / 3 correct</text>
  <line x1="80" y1="635" x2="1120" y2="635" stroke="#D8E2DA"/>
  <text x="80" y="660" fill="#52635A" font-family="IBM Plex Sans, sans-serif" font-size="16">Synthetic contract fixture, not a production accuracy estimate.</text>
</svg>
