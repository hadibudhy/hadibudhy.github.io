<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Keep 165 events without a session ID out of session conversion</title>
  <desc id="desc">The event model validates keys and categories while preserving the missing-session boundary. Source: REES46 Electronics behaviour export and quality mart.</desc>
  <rect width="1200" height="680" fill="#FAFAF8"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#225B73"/>
  <text x="82" y="72" fill="#202B30" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Keep 165 events without a session ID out of session conversion</text>
  <text x="82" y="150" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The event model validates keys and categories while preserving the missing-session boundary.</text>
  <rect x="82" y="220" width="480" height="310" fill="#E8F0ED" stroke="#64867E"/><rect x="638" y="220" width="480" height="310" fill="#F5EEE7" stroke="#94632C"/><text x="112" y="270" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Validated or directly observed</text><text x="668" y="270" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Not observed / do not claim</text><text x="120" y="320" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="320" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">885,129 recorded events across</text><text x="155" y="343" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">view, cart, and purchase</text><text x="120" y="368" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="368" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">unique event_id and accepted</text><text x="155" y="391" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">event types</text><text x="120" y="416" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="416" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">timestamps parsed at the event</text><text x="155" y="439" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">grain</text><text x="676" y="320" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="320" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">165 rows have no user_session</text><text x="676" y="368" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="368" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">event totals alone do not</text><text x="711" y="391" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">measure unique users</text><text x="676" y="416" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="416" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">session conversion needs</text><text x="711" y="439" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">identified sessions</text>
  <text x="82" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: REES46 Electronics behaviour export and quality mart</text>
  <text x="1118" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Observed vs not observed</text>
</svg>