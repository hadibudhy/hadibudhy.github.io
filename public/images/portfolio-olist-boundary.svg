<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Delivery promise and review are observable; root cause and profit are not</title>
  <desc id="desc">The diagnostic keeps seller, carrier, product, and commercial conclusions separate. Source: Olist Brazilian E-commerce Public Dataset.</desc>
  <rect width="1200" height="680" fill="#FAFAF8"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#225B73"/>
  <text x="82" y="72" fill="#202B30" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Delivery promise and review are observable; root cause and profit are</text><text x="82" y="106" fill="#202B30" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">not</text>
  <text x="82" y="150" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The diagnostic keeps seller, carrier, product, and commercial conclusions separate.</text>
  <rect x="82" y="220" width="480" height="310" fill="#E8F0ED" stroke="#64867E"/><rect x="638" y="220" width="480" height="310" fill="#F5EEE7" stroke="#94632C"/><text x="112" y="270" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Observed in the public source</text><text x="668" y="270" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Not observed / do not claim</text><text x="120" y="320" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="320" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">estimated and actual delivery</text><text x="155" y="343" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">dates</text><text x="120" y="368" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="368" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">seller, product, freight, review</text><text x="120" y="416" fill="#64867E" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="416" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">one-to-many order relationships</text><text x="676" y="320" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="320" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">carrier identity and scan events</text><text x="676" y="368" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="368" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">unplaced or cancelled demand</text><text x="676" y="416" fill="#94632C" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="416" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">order contribution margin</text>
  <text x="82" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Olist Brazilian E-commerce Public Dataset</text>
  <text x="1118" y="635" fill="#52636B" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Observed vs not observed</text>
</svg>