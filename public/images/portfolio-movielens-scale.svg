<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MovieLens is large enough to test relevance and catalog coverage separately</title>
  <desc id="desc">The stable GroupLens release supports offline ranking diagnostics, not watch-time claims. Source: GroupLens MovieLens 25M.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">MovieLens is large enough to test relevance and catalog coverage</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">separately</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The stable GroupLens release supports offline ranking diagnostics, not watch-time claims.</text>
  <rect x="82" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="106" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">25M</text><text x="106" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">ratings</text><text x="106" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">User × movie</text><text x="106" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">feedback</text><rect x="360" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="384" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">1M</text><text x="384" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">tag applications</text><text x="384" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Semantic signals</text><rect x="638" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="662" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">62,000</text><text x="662" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">movies</text><text x="662" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Catalog</text><text x="662" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">denominator</text><rect x="916" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="940" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">162,000</text><text x="940" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">users</text><text x="940" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Historical raters</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: GroupLens MovieLens 25M</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Real source metadata</text>
