<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cleaning customer identity changes the growth denominator</title>
  <desc id="desc">The UCI Online Retail release contains missing customer IDs and transaction rows that must be handled before retention analysis. Source: UCI Online Retail validation record.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Cleaning customer identity changes the growth denominator</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The UCI Online Retail release contains missing customer IDs and transaction rows that must be</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">handled before retention analysis.</text>
  <text x="82" y="215" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="700" text-anchor="start">Records / customers (different units)</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="170" y="255.0" width="160" height="250.0" fill="#155eef"/><text x="250.0" y="237.0" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">541909</text><text x="250.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Raw rows</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="410" y="442.7" width="160" height="62.3" fill="#10b981"/><text x="490.0" y="424.6832641642785" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">135080</text><text x="490.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Missing</text><text x="490.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">CustomerID</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="650" y="503.0" width="160" height="2.0" fill="#155eef"/><text x="730.0" y="484.99874148611667" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">4338</text><text x="730.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Identifiable</text><text x="730.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">customers</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: UCI Online Retail validation record</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Do not compare unlike units as a rate</text>
</svg>