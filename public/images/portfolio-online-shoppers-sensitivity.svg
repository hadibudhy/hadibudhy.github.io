<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The visitor contrast survives the exact-row deduplication choice</title>
  <desc id="desc">Revenue=True share before and after removing 125 exact-identical rows; raw n=12,330, deduplicated n=12,205. Source: UCI Online Shoppers Purchasing Intention dataset.</desc>
