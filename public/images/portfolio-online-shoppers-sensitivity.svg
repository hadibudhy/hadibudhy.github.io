  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Revenue=True share before and after removing 125 exact-identical rows; raw n=12,330,</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">deduplicated n=12,205.</text>
  <text x="82" y="215" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="700" text-anchor="start">Session conversion rate (%)</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="170" y="255.0" width="160" height="250.0" fill="#155eef"/><text x="250.0" y="236.99999999999997" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">24.9</text><text x="250.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">New: raw</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="410" y="255.0" width="160" height="250.0" fill="#10b981"/><text x="490.0" y="236.99999999999997" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">24.9</text><text x="490.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">New:</text><text x="490.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">deduplicated</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="650" y="365.4" width="160" height="139.6" fill="#155eef"/><text x="730.0" y="347.44176706827307" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">13.9</text><text x="730.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Returning: raw</text><line x1="110" y1="505" x2="1080" y2="505" stroke="#d9dde3" stroke-width="2"/><rect x="890" y="363.4" width="160" height="141.6" fill="#10b981"/><text x="970.0" y="345.433734939759" fill="#171717" font-family="Arial, sans-serif" font-size="24px" font-weight="700" text-anchor="middle">14.1</text><text x="970.0" y="539" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">Returning:</text><text x="970.0" y="561" fill="#171717" font-family="Arial, sans-serif" font-size="17px" font-weight="700" text-anchor="middle">deduplicated</text>
