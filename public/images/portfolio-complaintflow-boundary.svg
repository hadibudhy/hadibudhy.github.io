<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A synthetic fixture validates software behavior, not real-world model quality</title>
  <desc id="desc">The system contract is testable; production performance needs privacy-reviewed labeled complaints. Source: ComplaintFlow project documentation.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">A synthetic fixture validates software behavior, not real-world model</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">quality</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The system contract is testable; production performance needs privacy-reviewed labeled</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">complaints.</text>
  <rect x="82" y="220" width="480" height="310" fill="#ecfdf5" stroke="#10b981"/><rect x="638" y="220" width="480" height="310" fill="#fff7ed" stroke="#d97706"/><text x="112" y="270" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Observed in the public source</text><text x="668" y="270" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Not observed / do not claim</text><text x="120" y="320" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">routing schema and fallbacks</text><text x="120" y="368" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">provider retries and audit log</text><text x="120" y="416" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">evaluation slices in fixture</text><text x="676" y="320" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">representative complaint</text><text x="711" y="343" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">prevalence</text><text x="676" y="368" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">hosted-model production accuracy</text><text x="676" y="416" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">real customer resolution impact</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: ComplaintFlow project documentation</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Observed vs not observed</text>
