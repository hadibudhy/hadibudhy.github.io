  <text x="82" y="150" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The selected comparison changes before the policy; this descriptive screen is not a formal</text><text x="82" y="174" fill="#52636B" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">parallel-trends test.</text>
