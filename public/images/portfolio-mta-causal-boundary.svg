ze="22px" font-weight="700" text-anchor="start">-</text><text x="711" y="416" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">causal effect from this</text><text x="711" y="439" fill="#202B30" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">comparator</text>
