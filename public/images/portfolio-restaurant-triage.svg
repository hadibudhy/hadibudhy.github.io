<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Restaurant inspection work needs an inspection-level quality queue</title>
  <desc id="desc">The validated 2022–2025 rollup contains 73,211 inspections, including 30,037 without a recorded grade. Source: NYC Restaurant Inspection Results.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Restaurant inspection work needs an inspection-level quality queue</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The validated 2022–2025 rollup contains 73,211 inspections, including 30,037 without a recorded</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">grade.</text>
  <rect x="82" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="106" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">73,211</text><text x="106" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">inspection records</text><text x="106" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">One inspection</text><text x="106" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">grain</text><rect x="360" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="384" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">30,037</text><text x="384" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">without grade</text><text x="384" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Follow-up</text><text x="384" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">uncertainty</text><rect x="638" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="662" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">2022–2025</text><text x="662" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">analysis window</text><text x="662" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Comparable period</text><rect x="916" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="940" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">1</text><text x="940" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">inspection</text><text x="940" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Not one row per</text><text x="940" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">violation</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: NYC Restaurant Inspection Results</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Real source metadata</text>
</svg>