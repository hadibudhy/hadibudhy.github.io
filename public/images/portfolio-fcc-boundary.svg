<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The complaint source supports queue design but not a provider failure rate</title>
  <desc id="desc">Consumer selection and unverified allegations must remain visible in the AI workflow. Source: FCC CGB Consumer Complaints Data.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">The complaint source supports queue design but not a provider failure</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">rate</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Consumer selection and unverified allegations must remain visible in the AI workflow.</text>
  <rect x="82" y="220" width="480" height="310" fill="#ecfdf5" stroke="#10b981"/><rect x="638" y="220" width="480" height="310" fill="#fff7ed" stroke="#d97706"/><text x="112" y="270" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Observed in the public source</text><text x="668" y="270" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">Not observed / do not claim</text><text x="120" y="320" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">issue and complaint fields</text><text x="120" y="368" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">date and provider/location</text><text x="155" y="391" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">context</text><text x="120" y="416" fill="#10b981" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">✓</text><text x="155" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">narrative where available</text><text x="676" y="320" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="320" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">representative consumer</text><text x="711" y="343" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">prevalence</text><text x="676" y="368" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="368" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">verified provider fault</text><text x="676" y="416" fill="#d97706" font-family="Arial, sans-serif" font-size="22px" font-weight="700" text-anchor="start">—</text><text x="711" y="416" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">resolution quality from routing</text><text x="711" y="439" fill="#171717" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">alone</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: FCC CGB Consumer Complaints Data</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Observed vs not observed</text>
</svg>