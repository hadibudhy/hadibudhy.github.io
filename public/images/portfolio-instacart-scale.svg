  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Instacart exposes the sequence needed for reorder analysis</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The public release is relational: the decision depends on preserving order, product, and reorder</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">grain.</text>
  <rect x="82" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="106" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">3.4M</text><text x="106" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">orders</text><text x="106" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Order sequence and</text><text x="106" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">cadence</text><rect x="360" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="384" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">206,209</text><text x="384" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">users</text><text x="384" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Anonymous user</text><text x="384" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">histories</text><rect x="638" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="662" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">49,688</text><text x="662" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">products</text><text x="662" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Product and aisle</text><text x="662" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">metadata</text><rect x="916" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="940" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">6</text><text x="940" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">linked tables</text><text x="940" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Orders, products,</text><text x="940" y="455" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">taxonomy, and</text><text x="940" y="478" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">labels</text>
