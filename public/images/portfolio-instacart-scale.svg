<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Instacart exposes the sequence needed for reorder analysis</title>
  <desc id="desc">The public release is relational: the decision depends on preserving order, product, and reorder grain. Source: Instacart public release and competition documentation.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
