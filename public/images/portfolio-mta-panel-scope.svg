<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The MTA audit has a complete panel but the comparator still fails the causal test</title>
  <desc id="desc">The official panel covers facilities and weeks around the policy date; the pre-policy gap is unstable. Source: MTA Bridges and Tunnels Hourly Crossings.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">The MTA audit has a complete panel but the comparator still fails the</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">causal test</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The official panel covers facilities and weeks around the policy date; the pre-policy gap is</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">unstable.</text>
  <rect x="82" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="106" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">27,080</text><text x="106" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">facility-day rows</text><text x="106" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">10 facilities</text><rect x="360" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="384" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">3,880</text><text x="384" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">facility-week rows</text><text x="384" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">388 weeks</text><rect x="638" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="662" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">10</text><text x="662" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">facilities</text><text x="662" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Crossing locations</text><rect x="916" y="235" width="238" height="260" fill="#f7f8fa" stroke="#d9dde3"/><text x="940" y="292" fill="#155eef" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">−26 to +26</text><text x="940" y="354" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">event weeks</text><text x="940" y="432" fill="#737373" font-family="Arial, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Diagnostic window</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: MTA Bridges and Tunnels Hourly Crossings</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Real source metadata</text>
