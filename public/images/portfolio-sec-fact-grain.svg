<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SEC Company Facts carries the lineage needed for a trustworthy finance mart</title>
  <desc id="desc">Reported values are reusable only when their tag, unit, period, and filing identity stay visible. Source: SEC Company Facts API.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
