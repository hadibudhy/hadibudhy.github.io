  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">SEC Company Facts carries the lineage needed for a trustworthy finance</text><text x="82" y="106" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">mart</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">Reported values are reusable only when their tag, unit, period, and filing identity stay</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">visible.</text>
