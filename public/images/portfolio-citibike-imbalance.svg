<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Directional flow is a better rebalancing cue than station popularity</title>
  <desc id="desc">The analytical view follows real origin and destination fields; it is not a claim that low flow equals low demand. Source: Citi Bike System Data.</desc>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="48" y="42" width="10" height="90" rx="5" fill="#155eef"/>
  <text x="82" y="72" fill="#171717" font-family="Arial, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Directional flow is a better rebalancing cue than station popularity</text>
  <text x="82" y="150" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">The analytical view follows real origin and destination fields; it is not a claim that low flow</text><text x="82" y="174" fill="#737373" font-family="Arial, sans-serif" font-size="18px" font-weight="400" text-anchor="start">equals low demand.</text>
  <text x="82" y="208" fill="#155eef" font-family="Arial, sans-serif" font-size="15px" font-weight="700" text-anchor="start">CONCEPTUAL DESIGN</text><rect x="82.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="106.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">01</text><text x="102.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Count</text><text x="102.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Origins and destinations</text><line x1="414.0" y1="385" x2="430.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 420.0 376 L 430.0 385 L 420.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="438.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="462.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">02</text><text x="458.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Compare</text><text x="458.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Direction by peak window</text><line x1="770.0" y1="385" x2="786.0" y2="385" stroke="#155eef" stroke-width="3"/><path d="M 776.0 376 L 786.0 385 L 776.0 394" fill="none" stroke="#155eef" stroke-width="3"/><rect x="794.0" y="300" width="324.0" height="170" fill="#f7f8fa" stroke="#d9dde3"/><text x="818.0" y="348" fill="#155eef" font-family="Arial, sans-serif" font-size="18px" font-weight="700" text-anchor="start">03</text><text x="814.0" y="388" fill="#171717" font-family="Arial, sans-serif" font-size="19px" font-weight="700" text-anchor="start">Prioritize</text><text x="814.0" y="437" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Moves plus rider guidance</text>
  <text x="82" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Source: Citi Bike System Data</text>
  <text x="1118" y="635" fill="#737373" font-family="Arial, sans-serif" font-size="15px" font-weight="400" text-anchor="end">Conceptual design — not an observed outcome</text>
</svg>